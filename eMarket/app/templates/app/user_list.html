<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Approvals</title>
</head>
<body>
    <h2>Pending Users</h2>
    <form method="post" action="{% url 'user_list' %}">
        {% csrf_token %}
        {{ formset.management_form }}
        <table>
            {% for form in formset %}
                <tr>
                    <!-- use form to access data -->
                    <td>{{ form.id }}</td>
                    <td>{{ form.username.value }}</td>
                    <td>{{ form.user_type.value }}</td>
                    <td>{{ form.pending }}</td>
                </tr>
            {% empty %}
                <p>No pending users to approve.</p>
            {% endfor %}
        </table>
        <button type="submit">Update</button>
    </form>
    <a href="{% url 'admin_dashboard' %}" class="button">Back to Admin Dashboard</a>
</body>
</html>
