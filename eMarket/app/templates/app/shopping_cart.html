<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
</head>
<body>
    <h1>Shopping Cart</h1>
    <ul>
        {% for item in cart_items %}
            <li>{{ item.product.name }} - {{ item.quantity }} - ${{ item.get_total }}</li>
        {% empty %}
            <li>Your cart is empty.</li>
        {% endfor %}
    </ul>
    <p>Total: ${{ total }} </p>
    <a href="{% url 'checkout' %}">Proceed to Checkout</a>
    <br>
    <a href="{% url 'product_list' %}">Or continue shopping</a>
</body>
</html>
