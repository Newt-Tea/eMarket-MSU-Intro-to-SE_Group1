<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
</head>
<body>
    <h1>Order History</h1>
    <ul>
        {% for order in orders %}
            <li>Order #{{ order.id }} - {{ order.date }} - ${{ order.total }}</li>
        {% empty %}
            <li>You have no orders.</li>
        {% endfor %}
    </ul>
</body>
</html>
